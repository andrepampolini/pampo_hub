<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f96"><title>Pampo Print 3D | Vendas & Pedidos</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="precificacao/icon-192.png"><link rel="stylesheet" href="pedidos.css"></head><body><header><a class="back" href="index.html">← Tela principal</a><div><h1>Vendas & Pedidos</h1><p>Controle comercial da Pampo Print 3D</p></div></header><main><nav class="tabs"><button class="active" data-tab="new">＋ Novo pedido</button><button data-tab="history">▤ Registro de pedidos</button></nav><section id="new" class="panel"><h2>Dados do pedido</h2><form id="orderForm"><div class="two date-fields"><label>Data do pedido<input id="date" type="date" required></label><label>Previsão de entrega<input id="deliveryDate" type="date" required></label></div><label>Cliente<input id="client" placeholder="Nome do cliente" required></label><label>Descrição / observação<textarea id="description" rows="2" placeholder="Detalhes do pedido"></textarea></label><div class="products"><h3>Produtos (até 4 itens)</h3><div class="product-item"><label>Produto 1<input id="product1" placeholder="Nome do produto "></label><div class="two"><label>Quantidade<input id="qty1" type="number" min="1" value="1"></label><label>Preço unitário (R$)<input id="price1" type="number" min="0" step="0.01" placeholder="0,00"></label></div></div><div class="product-item"><label>Produto 2<input id="product2" placeholder="Nome do produto (opcional)"></label><div class="two"><label>Quantidade<input id="qty2" type="number" min="1" value="1"></label><label>Preço unitário (R$)<input id="price2" type="number" min="0" step="0.01" placeholder="0,00"></label></div></div><div class="product-item"><label>Produto 3<input id="product3" placeholder="Nome do produto (opcional)"></label><div class="two"><label>Quantidade<input id="qty3" type="number" min="1" value="1"></label><label>Preço unitário (R$)<input id="price3" type="number" min="0" step="0.01" placeholder="0,00"></label></div></div><div class="product-item"><label>Produto 4<input id="product4" placeholder="Nome do produto (opcional)"></label><div class="two"><label>Quantidade<input id="qty4" type="number" min="1" value="1"></label><label>Preço unitário (R$)<input id="price4" type="number" min="0" step="0.01" placeholder="0,00"></label></div></div></div><div class="two"><label>Pagamento<select id="payment"><option>Pendente</option><option>Sinal pago</option><option>Pago</option></select></label><label>Status do pedido<select id="status"><option>Aguardando aprovação</option><option>Produção</option><option>Em rota</option><option>Entregue</option></select></label></div><button class="primary" type="submit">Salvar pedido</button><p id="feedback" role="status"></p></form></section><section id="history" class="panel hidden"><h2>Registro de pedidos</h2><div class="stats"><article><small>Pedidos neste mês</small><b id="monthCount">0</b></article><article><small>Pedidos neste ano</small><b id="yearCount">0</b></article></div><div class="filters"><label>Mês<input type="month" id="filterMonth"></label><label>Ano<select id="filterYear"></select></label></div><div id="ordersList"></div></section></main><script src="pedidos.js"></script></body></html>
